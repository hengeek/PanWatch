<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'">
<title>PanWatch 盯盘</title>
<style>
:root{color-scheme:light;--ink:#242b29;--muted:#7d8680;--line:#e5e9e3;--up:#c65246;--down:#26836b}*{box-sizing:border-box}body{margin:0;background:#f6f7f2;color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;color:inherit;border-radius:7px;padding:9px 14px}button:hover{background:#edf1e9}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible{outline:2px solid #26836b;outline-offset:3px}header{padding:30px 34px 22px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;letter-spacing:3px;color:var(--muted)}h1{font-size:28px;letter-spacing:-1px;font-weight:600;margin:10px 0 0}header p{margin:9px 0;color:var(--muted);font-size:12px}.controls{display:flex;gap:8px;align-items:center}.layout{display:grid;grid-template-columns:190px 1fr;min-height:calc(100vh - 136px);border-top:1px solid var(--line)}aside{padding:25px 16px;border-right:1px solid var(--line)}aside label{display:block;color:var(--muted);font-size:11px;letter-spacing:2px;margin:7px 12px 13px}aside button{display:flex;justify-content:space-between;width:100%;border:0;background:transparent;text-align:left;margin:4px 0;padding:12px}aside button.active{background:#e3ebe0;color:#264e3f;font-weight:600}aside small{font-weight:400;color:var(--muted)}main{padding:24px 28px;min-width:0}.summary{display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:25px;border-bottom:1px solid var(--line);gap:16px}.metric label{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.7px;margin-top:10px}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:24px 0 16px;gap:12px}.toolbar h2{font-size:17px;margin:0}.toolbar input{width:200px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:9px 12px}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}th{font-size:11px;color:var(--muted);font-weight:500;padding:12px 10px;border-bottom:1px solid var(--line)}td{padding:18px 10px;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left;padding-left:0}td:first-child strong{display:block;font-size:14px;font-weight:500}td small{display:block;font-size:11px;color:var(--muted);margin-top:6px}tbody tr:hover{background:#edf1e94d}.up{color:var(--up)}.down{color:var(--down)}.neutral{color:var(--muted)}.empty{text-align:center;padding:65px 10px;color:var(--muted)}footer{font-size:11px;color:var(--muted);padding-top:20px;line-height:1.8}#notice{padding:12px 18px;background:#fff1da;color:#815e27;border-radius:6px;margin-bottom:18px}dialog{border:1px solid var(--line);border-radius:15px;padding:32px;width:420px;box-shadow:0 20px 80px #25312522}dialog::backdrop{background:#f1f3edcf}dialog h2{margin:0 0 10px}dialog p{color:var(--muted);line-height:1.7;font-size:12px}form label{display:block;margin-top:17px;font-size:12px}form input{display:block;width:100%;padding:11px;border:1px solid var(--line);border-radius:6px;margin-top:7px}form button[type=submit]{width:100%;margin-top:23px;background:#284e40;color:#fff}#loginError{color:var(--up);font-size:12px;line-height:1.6}.badge{width:7px;height:7px;background:#95a58f;border-radius:50%;display:inline-block;margin-right:5px}@media(max-width:850px){header{padding:22px}.layout{grid-template-columns:155px 1fr}main{padding:20px 16px}.metric strong{font-size:22px}.controls{flex-wrap:wrap;justify-content:flex-end}.toolbar input{width:160px}}
</style>
<header><div><div class="brand">PANWATCH / DESKTOP</div><h1>把目光，留给持仓。</h1><p><span class="badge"></span><span id="status" role="status">连接你的 PanWatch 服务</span></p></div><div class="controls"><label style="font-size:12px;color:var(--muted)"><input id="auto" type="checkbox" checked> 30 秒刷新</label><button id="refresh">刷新 ↻</button><button id="settings">连接设置</button></div></header>
<div class="layout"><aside id="groups" aria-label="股票分组"></aside><main><div id="notice" role="alert" hidden></div><section class="summary"><div class="metric"><label>持仓市值 · 人民币</label><strong id="value">—</strong></div><div class="metric"><label>浮动盈亏 · 人民币</label><strong id="pnl">—</strong></div><div class="metric"><label>当日盈亏 · 人民币</label><strong id="daily">—</strong></div></section><div class="toolbar"><h2 id="groupTitle">全部持仓</h2><input id="search" type="search" placeholder="搜索名称 / 代码" aria-label="搜索股票"></div><div class="table-scroll"><table><thead><tr><th>股票 / 账户</th><th>现价</th><th>涨跌幅</th><th>浮动盈亏</th><th>当日盈亏</th><th>成本 / 股数</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty">连接后显示持仓与关注股票</div><footer>红涨绿跌 · 现价与成本使用股票原币，盈亏统一折算人民币。<br>行情取决于服务端数据源；休市、过期或缺失行情以「—」显示当日变化。</footer></main></div>
<dialog id="connect"><form id="login"><h2>连接 PanWatch</h2><p>读取项目中已有的持仓和关注股票。本机默认地址为 http://127.0.0.1:8000；请使用 PanWatch 服务端口。密码不会保存。</p><label>服务地址<input id="server" type="url" required placeholder="http://127.0.0.1:8000"></label><label>用户名<input id="username" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><p id="loginError" role="alert"></p><button type="submit">连接并读取股票</button><button id="cancel" type="button" style="width:100%;margin-top:8px">返回</button></form></dialog><script src="watch.js"></script></html>
